apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.omerzikirmatik.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.omerzikirmatik.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 24
        versionName "1.2.12"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                logger.warn(
                    'android/keystore.properties yok — release debug imzalı üretilir. ' +
                    'Play Store için keystore.properties.example dosyasına bakın.'
                )
            }
            // R8: kullanılmayan kodu atar, kalanı karartır. Play "DEX kodu
            // optimizasyonu" eşiği (her kategoride %25) bunu şart koşuyor;
            // kapalıyken kod karartma %5'te kalıyordu.
            //
            // Eklenti köprüsü reflection kullanıyor ama Capacitor kendi keep
            // kurallarını AAR'ıyla gönderiyor (consumerProguardFiles), bizim
            // eklediklerimiz proguard-rules.pro'da.
            minifyEnabled true
            // Kaynak küçültme: adıyla çözülen kaynaklar res/raw/keep.xml'de korunuyor.
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Amazon Appstore modülü dışlandı. Yalnız Google Play'de satıyoruz ve bu modül
// R8 kurallarına -dontoptimize koyuyor; o direktif GLOBAL, yani tüm uygulamada
// optimizasyon geçişini kapatıyordu (ölçüldü: optimizasyon %0 -> %34,3).
//
// Modülün içinde yalnızca AmazonConfiguration + Builder'ı var; RevenueCat'i
// Amazon için yapılandırırken kullanılıyor, biz Purchases.configure({apiKey})
// ile Play'e gidiyoruz (lib/premium-purchase.js). Amazon entegrasyon sınıfları
// zaten çekirdek purchases modülünde duruyor; burada giden sadece bu iki
// yapılandırma sınıfı ve Amazon'un cihaz SDK'sı.
//
// Amazon Appstore'a çıkılırsa bu blok kaldırılmalı.
configurations.all {
    exclude group: 'com.revenuecat.purchases', module: 'purchases-store-amazon'
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info(
        'google-services.json not found — Firebase/Crashlytics devre dışı. ' +
        'android/app/google-services.json.example dosyasına bakın.'
    )
}