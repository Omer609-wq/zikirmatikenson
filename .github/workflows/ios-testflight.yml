name: iOS → TestFlight

# Elle tetiklenir: GitHub → Actions → "iOS → TestFlight" → Run workflow.
# Her çalıştırma TestFlight'a yeni bir derleme yükler; push'ta kendiliğinden çalışmaz.
#
# Gereken depo sırları (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID       developer.apple.com → Membership details
#   ASC_KEY_ID          App Store Connect → Users and Access → Integrations → Team Keys
#   ASC_ISSUER_ID       aynı sayfanın üstü
#   ASC_KEY_P8_BASE64   indirilen AuthKey_XXXX.p8 dosyasının base64'ü
#   FIREBASE_WEB_CONFIG public/firebase-config.json'ın içeriği olduğu gibi
#
# İmzalama: sertifika dosyası yok. App Store Connect API anahtarı (Admin) ile Xcode
# bulut Mac'te sertifikayı ve profili kendisi alır (-allowProvisioningUpdates).
# Depo açık olduğu için anahtar yalnızca sırlarda durur, çalışma sonunda silinir.

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # TestFlight aynı sürümde tekrar eden derleme numarasını reddeder; her
      # çalıştırma kendi numarasını alır. Workflow yeniden adlandırılırsa sayaç
      # sıfırlanır — o zaman MARKETING_VERSION'ı artırmak gerekir.
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v5

      - name: Sırlar tanımlı mı
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 FIREBASE_WEB_CONFIG; do
            if [ -z "${!name}" ]; then
              echo "::error::$name sırrı tanımlı değil"
              missing=1
            fi
          done
          exit $missing

      # Apple her bahar en yeni SDK'yı şart koşuyor; kurulu en güncel kararlı Xcode seçilir.
      - name: Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # public/firebase-config.json depoda yok (.gitignore). Paylaşımlı hatim onsuz
      # "kullanılamıyor" der; Web app ayarı olmalı (appId içinde :web:).
      - name: Firebase web ayarı
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: |
          printf '%s' "$FIREBASE_WEB_CONFIG" > public/firebase-config.json
          node -e "const c = require('./public/firebase-config.json'); if (!String(c.appId).includes(':web:')) { console.error('::error::FIREBASE_WEB_CONFIG bir Web app ayarı değil'); process.exit(1); }"

      - name: Web derlemesi ve Capacitor senkronu
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: CocoaPods
        working-directory: ios/App
        run: pod install

      - name: App Store Connect API anahtarı
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Arşiv İMZASIZ alınır, imzayı yükleme adımı (exportArchive) atar.
      #
      # Neden: otomatik imzalama arşiv aşamasında yalnız geliştirme imzasına izin
      # veriyor. Geliştirme profili hesaba kayıtlı bir cihaz ister ("Your team has
      # no devices"); dağıtım kimliğini elle vermek ise "conflicting provisioning
      # settings" ile reddediliyor — üstelik komut satırı ayarı bütün Pods
      # hedeflerine de uygulanıyor. Export aşaması ise App Store için imzalar:
      # buluttaki dağıtım sertifikası + App Store profili, cihaz istemez, bulut
      # Mac'te her çalıştırmada yeni geliştirme sertifikası da üretilmez.
      # CODE_SIGNING_ALLOWED=NO'nun Pods'a da uygulanması burada istenen şey:
      # "[CP] Embed Pods Frameworks" imzalamayı atlar, export hepsini imzalar.
      - name: Arşiv
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: TestFlight'a yükle
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "::notice::Derleme $BUILD_NUMBER yüklendi. App Store Connect → TestFlight'ta işlenmesi 5-30 dk sürer."

      - name: Anahtarı sil
        if: always()
        run: rm -f "$ASC_KEY_PATH"
